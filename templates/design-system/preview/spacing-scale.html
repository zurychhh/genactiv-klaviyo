<!doctype html>
<!-- @dsCard group="Spacing" name="Spacing Scale" subtitle="4px base, 1–9 steps" viewport="700x300" --><html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../fonts/fonts.css">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
<style>
.rows { display:flex; flex-direction:column; gap:9px; }
.r { display:flex; align-items:center; gap:14px; }
.bar { height:16px; background:var(--ga-red); border-radius:3px; }
.k { width:34px; font-size:11px; font-weight:700; }
.v { font-size:11px; color:var(--ga-fg3); }
</style></head>
<body><div class="card"><div class="rows">
  <div class="r"><span class="k">1</span><div class="bar" style="width:4px"></div><span class="v">4px · icon gap</span></div>
  <div class="r"><span class="k">2</span><div class="bar" style="width:8px"></div><span class="v">8px</span></div>
  <div class="r"><span class="k">3</span><div class="bar" style="width:12px"></div><span class="v">12px · inline</span></div>
  <div class="r"><span class="k">4</span><div class="bar" style="width:16px"></div><span class="v">16px · base</span></div>
  <div class="r"><span class="k">5</span><div class="bar" style="width:24px"></div><span class="v">24px · gutter</span></div>
  <div class="r"><span class="k">6</span><div class="bar" style="width:32px"></div><span class="v">32px</span></div>
  <div class="r"><span class="k">7</span><div class="bar" style="width:48px"></div><span class="v">48px</span></div>
  <div class="r"><span class="k">8</span><div class="bar" style="width:64px"></div><span class="v">64px · section</span></div>
  <div class="r"><span class="k">9</span><div class="bar" style="width:96px"></div><span class="v">96px · section xl</span></div>
</div></div></body></html>
