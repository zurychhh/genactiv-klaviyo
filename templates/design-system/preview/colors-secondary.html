<!doctype html>
<!-- @dsCard group="Colors" name="Secondary — Pink, Cream, Gold" subtitle="Fiberbiom pink + colostrum warm tones" viewport="700x150" --><html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../fonts/fonts.css">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
<style>
.sw { display:flex; flex-direction:column; gap:8px; }
.chip { height:78px; border-radius:12px; box-shadow: inset 0 0 0 1px rgba(0,0,0,.04); display:flex; align-items:flex-end; padding:8px 10px; }
.hex { font-size:11px; font-weight:700; }
.name { font-size:12px; font-weight:600; color:var(--ga-fg1); }
.sub { font-size:11px; color:var(--ga-fg3); }
.grid { display:grid; grid-template-columns: repeat(4, 1fr); gap:14px; }
</style></head>
<body><div class="card">
  <div class="grid">
    <div class="sw"><div class="chip" style="background:var(--ga-pink)"><span class="hex" style="color:#fff">#F5669C</span></div><div class="name">Fiberbiom Pink</div><div class="sub">Gut-health sub-brand</div></div>
    <div class="sw"><div class="chip" style="background:var(--ga-pink-soft)"><span class="hex" style="color:var(--ga-pink-hover)">#FDE4EE</span></div><div class="name">Pink Soft</div><div class="sub">Tint · band</div></div>
    <div class="sw"><div class="chip" style="background:var(--ga-cream)"><span class="hex" style="color:var(--ga-gray-700)">#FBEFE2</span></div><div class="name">Cream</div><div class="sub">Soft section fill</div></div>
    <div class="sw"><div class="chip" style="background:var(--ga-gold)"><span class="hex" style="color:#5c3d10">#E9B872</span></div><div class="name">Colostrum Gold</div><div class="sub">Powder accent</div></div>
  </div>
</div></body></html>
