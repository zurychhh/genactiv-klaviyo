<!doctype html>
<!-- @dsCard group="Brand" name="Logo Lockup" subtitle="Red on white / white on red" viewport="700x190" --><html lang="en"><head><meta charset="utf-8">

<link rel="stylesheet" href="../colors_and_type.css">
<style>
.split { display:grid; grid-template-columns: 1fr 1fr; gap:0; border-radius:14px; overflow:hidden; box-shadow: inset 0 0 0 1px var(--ga-gray-150); }

.cell img { width:200px; height:auto; }
</style></head>
<body><div class="card">
  <div class="split">
    <div class="cell" style="background:#fff"><img src="../assets/logo-primary.png" alt="Genactiv logo"></div>
    <div class="cell" style="background:var(--ga-red)"><img src="../assets/logo-white.png" alt="Genactiv logo white"></div>
  </div>
</div></body></html>
