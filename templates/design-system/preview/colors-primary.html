<!doctype html>
<!-- @dsCard group="Colors" name="Primary — Brand Red" subtitle="#F5333F and its hover/photo/soft variants" viewport="700x150" --><html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../fonts/fonts.css">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
<style>
.sw { display:flex; flex-direction:column; gap:8px; }
.chip { height:78px; border-radius:12px; box-shadow: inset 0 0 0 1px rgba(0,0,0,.04); display:flex; align-items:flex-end; padding:8px 10px; }
.chip .hex { font-size:11px; font-weight:700; }
.name { font-size:12px; font-weight:600; color:var(--ga-fg1); }
.sub { font-size:11px; color:var(--ga-fg3); }
.grid { display:grid; grid-template-columns: repeat(4, 1fr); gap:14px; }
</style></head>
<body><div class="card">
  <div class="grid">
    <div class="sw"><div class="chip" style="background:var(--ga-red)"><span class="hex" style="color:#fff">#F5333F</span></div><div class="name">Brand Red</div><div class="sub">Primary · CTA · brand</div></div>
    <div class="sw"><div class="chip" style="background:var(--ga-red-hover)"><span class="hex" style="color:#fff">#DB2A36</span></div><div class="name">Red Hover</div><div class="sub">Hover / pressed</div></div>
    <div class="sw"><div class="chip" style="background:var(--ga-red-photo)"><span class="hex" style="color:#fff">#FF3E49</span></div><div class="name">Photo Red</div><div class="sub">Full-bleed photo bg</div></div>
    <div class="sw"><div class="chip" style="background:var(--ga-red-soft)"><span class="hex" style="color:var(--ga-red)">#FFE7E8</span></div><div class="name">Red Soft</div><div class="sub">Tint · badge · hover</div></div>
  </div>
</div></body></html>
